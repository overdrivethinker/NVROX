<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="none" fill="none">
  <style>
    .outline { stroke: rgba(128,128,128,0.55); stroke-width: 2; fill: none; }
    .room    { fill: rgba(128,128,128,0.06); stroke: rgba(128,128,128,0.45); stroke-width: 1.2; }
    .dash    { stroke: rgba(128,128,128,0.3); stroke-width: 1; stroke-dasharray: 6 6; }
    .label   { fill: #6b7280; font-family: sans-serif; font-size: 20px; font-weight: 600; letter-spacing: 2px; }
    .label-s { fill: #6b7280; font-family: sans-serif; font-size: 12px; }
  </style>  

  <rect class="room" x="70" y="90" width="860" height="230" rx="6" />
  <text class="label" x="500" y="200" text-anchor="middle">FACTORY 1</text>
  <text class="label-s" x="500" y="225" text-anchor="middle">Tinggi: 3500</text>

  <rect class="room" x="70" y="340" width="240" height="140" rx="6" />
  <text class="label-s" x="190" y="410" text-anchor="middle">Part Storage 1</text>

  <rect class="room" x="330" y="340" width="600" height="140" rx="6" />
  <text class="label" x="630" y="410" text-anchor="middle">FACTORY 2</text>
  <text class="label-s" x="630" y="435" text-anchor="middle">Tinggi: 2900</text>

  <rect class="room" x="70" y="500" width="860" height="140" rx="6" />
  <text class="label" x="500" y="570" text-anchor="middle">FACTORY 3</text>

  <line class="dash" x1="40" y1="490" x2="960" y2="490" />
</svg>